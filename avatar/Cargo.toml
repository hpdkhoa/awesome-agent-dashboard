[package]
name = "agent-avatar"
version = "0.1.0"
edition = "2024"

[dependencies]
nvml-wrapper = "0.13.0"
serde_json = "1.0.154"
sysinfo = "0.40.1"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"

[build-dependencies]
tauri-build = "2.7.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
